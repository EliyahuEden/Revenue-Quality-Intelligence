name: Rebuild and validate analytics
on:
  workflow_dispatch:
  push:
    paths: ['scripts/**', 'sql/**', 'tests/**', 'requirements.txt', 'config.json']
  pull_request:
    paths: ['scripts/**', 'sql/**', 'tests/**', 'requirements.txt', 'config.json']
permissions:
  contents: read
jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/pipeline.py
      - run: python scripts/build_powerbi.py
      - run: python -m pytest tests -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: |
            reports/run_manifest.json
            reports/data_quality.json
            reports/query_plan.txt
